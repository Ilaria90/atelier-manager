version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: atelier_password
      POSTGRES_DB: atelier
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: